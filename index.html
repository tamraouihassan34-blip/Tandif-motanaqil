<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عقاري | بيع وشراء وكراء العقارات في المغرب</title>

<meta name="description" content="عقاري - منصة لبيع وشراء وكراء العقارات في المغرب">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Tahoma,sans-serif;
  background:#f5f7fb;
  color:#172033;
  line-height:1.6;
}

button,input,select,textarea{
  font-family:inherit;
}

button{
  cursor:pointer;
}

/* HEADER */
header{
  background:#071a35;
  color:white;
  padding:15px 5%;
  position:sticky;
  top:0;
  z-index:1000;
  box-shadow:0 4px 15px rgba(0,0,0,.15);
}

.nav{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-size:28px;
  font-weight:bold;
  color:#f5c451;
  white-space:nowrap;
}

nav a{
  color:white;
  text-decoration:none;
  margin:0 7px;
  font-weight:bold;
}

nav a:hover{
  color:#f5c451;
}

/* HERO */
.hero{
  background:linear-gradient(135deg,#071a35,#17638d);
  color:white;
  text-align:center;
  padding:60px 5%;
}

.hero h1{
  font-size:40px;
  margin-bottom:10px;
}

.hero p{
  font-size:18px;
  margin-bottom:22px;
}

.add-btn{
  background:#16a34a;
  color:white;
  border:0;
  padding:14px 25px;
  border-radius:12px;
  font-weight:bold;
  font-size:16px;
  margin-bottom:28px;
}

.add-btn:hover{
  background:#12863c;
}

/* SEARCH */
.search{
  max-width:1100px;
  margin:auto;
  background:white;
  padding:18px;
  border-radius:18px;
  display:grid;
  grid-template-columns:1.4fr 1fr 1fr 1fr 100px;
  gap:10px;
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}

input,select,textarea{
  width:100%;
  padding:13px;
  border:1px solid #ddd;
  border-radius:10px;
  font-size:15px;
  outline:none;
  background:white;
}

input:focus,select:focus,textarea:focus{
  border-color:#17638d;
  box-shadow:0 0 0 2px rgba(23,99,141,.08);
}

.search button{
  background:#f5c451;
  color:#071a35;
  border:0;
  border-radius:10px;
  font-weight:bold;
}

/* SECTIONS */
.container{
  max-width:1200px;
  margin:auto;
  padding:45px 5%;
}

.title{
  text-align:center;
  margin-bottom:30px;
}

.title h2{
  font-size:30px;
}

.title p{
  color:#667085;
}

/* CARDS */
.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}

.card{
  background:white;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 7px 25px rgba(0,0,0,.08);
  transition:.25s;
}

.card:hover{
  transform:translateY(-4px);
}

.card-img{
  width:100%;
  height:220px;
  object-fit:cover;
  display:block;
  background:#e8edf3;
}

.card-body{
  padding:18px;
}

.badge{
  display:inline-block;
  background:#f5c451;
  color:#071a35;
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.card h3{
  margin-top:10px;
}

.price{
  font-size:21px;
  font-weight:bold;
  color:#123e67;
  margin:8px 0;
}

.location{
  color:#667085;
  font-size:14px;
}

.description{
  color:#667085;
  font-size:14px;
  margin-top:8px;
  min-height:45px;
}

.actions{
  display:flex;
  gap:8px;
  margin-top:15px;
}

.whatsapp,.details{
  flex:1;
  border:0;
  padding:12px;
  border-radius:10px;
  font-weight:bold;
}

.whatsapp{
  background:#20c76b;
  color:white;
}

.details{
  background:#123e67;
  color:white;
}

.whatsapp:hover,.details:hover{
  opacity:.9;
}

.empty{
  text-align:center;
  padding:40px;
  background:white;
  border-radius:15px;
  grid-column:1/-1;
  color:#667085;
}

/* ADD SECTION */
.add-section{
  background:linear-gradient(135deg,#071a35,#17638d);
  color:white;
  text-align:center;
  padding:40px 20px;
  border-radius:20px;
}

.add-section h2{
  font-size:28px;
  margin-bottom:10px;
}

.add-section p{
  margin-bottom:20px;
}

.add-section button{
  background:#f5c451;
  color:#071a35;
  border:0;
  padding:13px 24px;
  border-radius:10px;
  font-weight:bold;
  font-size:16px;
}

/* FOOTER */
footer{
  background:#071a35;
  color:white;
  padding:35px 5%;
  margin-top:30px;
}

.footer-inner{
  max-width:1200px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  gap:30px;
}

.footer-inner h2{
  color:#f5c451;
}

footer a{
  color:#f5c451;
  text-decoration:none;
}

/* MODALS */
.modal,.property-form{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.75);
  z-index:3000;
  padding:15px;
  overflow:auto;
}

.modal{
  align-items:center;
  justify-content:center;
}

.modal-box,.form-box{
  background:white;
  width:100%;
  max-width:700px;
  margin:30px auto;
  border-radius:20px;
  padding:25px;
  position:relative;
}

.modal-box{
  max-height:90vh;
  overflow:auto;
}

.form-box{
  max-width:600px;
}

.close{
  position:absolute;
  left:15px;
  top:8px;
  border:0;
  background:none;
  font-size:32px;
  cursor:pointer;
  color:#555;
}

.form-box h2{
  text-align:center;
  color:#071a35;
  margin-bottom:5px;
}

.form-subtitle{
  text-align:center;
  color:#667085;
  margin-bottom:20px;
}

.form-group{
  margin-bottom:14px;
}

.form-group label{
  display:block;
  font-weight:bold;
  margin-bottom:6px;
}

.submit-property{
  width:100%;
  padding:15px;
  border:0;
  border-radius:12px;
  background:#20c76b;
  color:white;
  font-size:17px;
  font-weight:bold;
  margin-top:5px;
}

.submit-property:hover{
  background:#18ad5b;
}

/* IMAGE PREVIEW */
.image-preview{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-top:12px;
}

.preview-item{
  position:relative;
  height:100px;
  border-radius:10px;
  overflow:hidden;
  background:#eee;
}

.preview-item img{
  width:100%;
  height:100%;
  object-fit:cover;
}

.preview-number{
  position:absolute;
  top:5px;
  right:5px;
  background:rgba(0,0,0,.65);
  color:white;
  padding:2px 7px;
  border-radius:20px;
  font-size:11px;
}

.modal-box img.main-image{
  width:100%;
  height:300px;
  object-fit:cover;
  border-radius:12px;
}

.modal-whatsapp{
  display:block;
  width:100%;
  background:#20c76b;
  color:white;
  text-align:center;
  text-decoration:none;
  padding:13px;
  border-radius:10px;
  font-weight:bold;
  margin-top:20px;
}

/* RESPONSIVE */
@media(max-width:950px){

  .search{
    grid-template-columns:1fr 1fr;
  }

  .search button{
    min-height:48px;
  }

  .cards{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:650px){

  header{
    padding:13px 4%;
  }

  .nav{
    flex-direction:column;
    gap:8px;
  }

  nav{
    text-align:center;
  }

  nav a{
    font-size:13px;
    margin:0 3px;
  }

  .hero{
    padding:45px 5%;
  }

  .hero h1{
    font-size:30px;
  }

  .hero p{
    font-size:16px;
  }

  .search{
    grid-template-columns:1fr;
  }

  .cards{
    grid-template-columns:1fr;
  }

  .footer-inner{
    display:block;
  }

  .footer-inner > div{
    margin-bottom:20px;
  }

  .modal-box,.form-box{
    padding:20px;
    margin:15px auto;
  }

  .image-preview{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<header>
  <div class="nav">

    <div class="logo">🏠 عقاري</div>

    <nav>
      <a href="#home">الرئيسية</a>
      <a href="#properties">العقارات</a>
      <a href="#add">أضف عقارك</a>
      <a href="#contact">اتصل بنا</a>
    </nav>

  </div>
</header>


<section class="hero" id="home">

  <h1>لقِ عقارك المناسب بسهولة</h1>
