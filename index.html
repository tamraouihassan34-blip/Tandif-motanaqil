<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تنظيف متنقل | أيت ملول - إنزكان</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  font-family:Arial,sans-serif;
  background:#f4fbfa;
  color:#173042;
  line-height:1.8;
}

header{
  background:white;
  padding:18px 6%;
  display:flex;
  justify-content:space-between;
  align-items:center;
  box-shadow:0 2px 12px rgba(0,0,0,.08);
  position:sticky;
  top:0;
  z-index:10;
}

.logo{
  font-size:22px;
  font-weight:bold;
  color:#087f7a;
}

nav a{
  text-decoration:none;
  color:#173042;
  margin-right:15px;
  font-weight:bold;
}

.hero{
  padding:70px 7%;
  text-align:center;
  background:linear-gradient(135deg,#dff8f4,#ffffff);
}

.hero h1{
  font-size:42px;
  color:#087f7a;
  margin-bottom:15px;
}

.hero h1 span{
  color:#173042;
}

.hero p{
  font-size:19px;
  max-width:700px;
  margin:0 auto 25px;
}

.btn{
  display:inline-block;
  padding:14px 25px;
  border-radius:30px;
  text-decoration:none;
  font-weight:bold;
  margin:6px;
  transition:.2s;
}

.whatsapp{
  background:#18b957;
  color:white;
}

.call{
  background:#087f7a;
  color:white;
}

.btn:hover{
  transform:scale(1.04);
}

section{
  padding:55px 7%;
}

.title{
  text-align:center;
  margin-bottom:30px;
}

.title h2{
  color:#087f7a;
  font-size:30px;
}

.cards{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
  gap:20px;
}

.card{
  background:white;
  padding:25px;
  border-radius:18px;
  text-align:center;
  box-shadow:0 5px 20px rgba(0,0,0,.08);
}

.card
