<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عقاري | بيع وشراء وكراء العقارات</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
font-family:Arial,Tahoma,sans-serif;
background:#f5f7fb;
color:#172033;
line-height:1.6
}

header{
background:#071a35;
color:white;
padding:16px 6%;
position:sticky;
top:0;
z-index:1000
}

.nav{
display:flex;
align-items:center;
justify-content:space-between
}

.logo{
font-size:26px;
font-weight:bold;
color:#f5c451
}

nav a{
color:white;
text-decoration:none;
margin:0 7px;
font-weight:bold
}

.hero{
background:linear-gradient(135deg,#071a35,#17638d);
color:white;
text-align:center;
padding:55px 6%
}

.hero h1{
font-size:38px;
margin-bottom:12px
}

.hero p{
font-size:18px;
margin-bottom:20px
}

.add-property-btn{
display:inline-block;
background:#16a34a;
color:white;
text-decoration:none;
padding:14px 25px;
border-radius:12px;
font-weight:bold;
margin-bottom:25px
}

.search{
max-width:1000px;
margin:auto;
background:white;
padding:15px;
border-radius:15px;
display:grid;
grid-template-columns:repeat(4,1fr);
gap:10px
}

input,select,textarea{
width:100%;
padding:13px;
border:1px solid #ddd;
border-radius:9px;
font-size:15px;
font-family:Arial
}

button{
border:0;
border-radius:9px;
padding:13px;
font-weight:bold;
cursor:pointer
}

.search button{
background:#f5c451;
color:#071a35
}

.container{
max-width:1200px;
margin:auto;
padding:40px 6%
}

.section-title{
text-align:center;
margin-bottom:25px
}

.cards{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px
}

.card{
background:white;
border-radius:15px;
overflow:hidden;
box-shadow:0 5px 20px #0001
}

.card img{
width:100%;
height:210px;
object-fit:cover
}

.card-body{
padding:17px
}

.badge{
display:inline-block;
background:#f5c451;
padding:5px 10px;
border-radius:20px;
font-size:12px;
font-weight:bold
}

.price{
font-size:21px;
font-weight:bold;
color:#123e67;
margin:8px 0
}

.location{
color:#667085
}

.card-actions{
display:flex;
gap:8px;
margin-top:15px
}

.whatsapp{
background:#20c76b;
color:white;
flex:1
}

.details{
background:#123e67;
color:white;
flex:1
}

.features{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:20px
}

.feature{
background:white;
padding:25px;
border-radius:15px;
text-align:center;
box-shadow:0 5px 20px #0001
}

.feature span{
font-size:35px
}

.form-box{
max-width:750px;
margin:auto;
background:white;
padding:25px;
border-radius:18px;
box-shadow:0 5px 25px #0002
}

.form-grid{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:20px
}

.full{
grid-column:1/-1
}

.primary{
background:#16a34a;
color:white
}

.info{
background:#ecfdf5;
padding:12px;
border-radius:10px;
margin-top:10px;
color:#166534
}

footer{
background:#071a35;
color:white;
padding:35px 6%;
margin-top:30px
}

.footer-grid{
max-width:1200px;
margin:auto;
display:grid;
grid-template-columns:2fr 1fr 1fr;
gap:25px
}

footer a{
color:#f5c451
}

.modal{
display:none;
position:fixed;
inset:0;
background:#0008;
z-index:3000;
align-items:center;
justify-content:center;
padding:20px
}

.modal-content{
background:white;
width:100%;
max-width:700px;
max-height:90vh;
overflow:auto;
border-radius:15px;
padding:25px;
position:relative
}

.close{
position:absolute;
left:15px;
top:8px;
font-size:30px;
cursor:pointer
}

@media(max-width:800px){

nav{
display:none
}

.hero h1{
font-size:30px
}

.search{
grid-template-columns:1fr
}

.cards{
grid-template-columns:1fr
}

.features{
grid-template-columns:1fr
}

.form-grid{
grid-template-columns:1fr
}

.footer-grid{
grid-template-columns:1fr
}

.full{
grid-column:auto
}

}
</style>
</head>

<body>

<header>
<div class="nav">
<div class="logo">🏠 عقاري</div>

<nav>
<a href="#home">الرئيسية</a>
<a href="#properties">العقارات</a>
<a href="#publish">أضف عقارك</a>
<a href="#contact">اتصل بنا</a>
</nav>
</div>
</header>


<section class
