<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Tamraoui-TM | الموقع الرسمي</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080808;
      color: white;
      line-height: 1.8;
    }

    /* HEADER */
    header {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px 20px;
      background:
        radial-gradient(circle at top, #333 0%, #111 45%, #050505 100%);
    }

    .logo {
      font-size: clamp(45px, 12vw, 90px);
      font-weight: 900;
      letter-spacing: 3px;
      margin-bottom: 10px;
    }

    .tm {
      color: #bdbdbd;
    }

    .tagline {
      font-size: 20px;
      color: #aaa;
      margin-bottom: 35px;
    }

    .hero-text {
      max-width: 650px;
      margin: auto;
      color: #ddd;
      font-size: 18px;
    }

    .buttons {
      margin-top: 35px;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .btn {
      display: inline-block;
      padding: 14px 28px;
      border-radius: 40px;
      text-decoration: none;
      font-weight: bold;
      font-size: 17px;
      transition: 0.3s;
    }

    .btn-main {
      background: white;
      color: black;
    }

    .btn-dark {
      border: 1px solid #555;
      color: white;
    }

    .btn:hover {
      transform: translateY(-4px);
      opacity: 0.85;
    }

    /* SECTIONS */
    section {
      padding: 80px 20px;
      text-align: center;
    }

    .light {
      background: #f5f5f5;
      color: #111;
    }

    .dark {
      background: #0d0d0d;
    }

    .title {
      font-size: 38px;
      margin-bottom: 15px;
    }

    .subtitle {
      color: #777;
      max-width: 650px;
      margin: 0 auto 45px;
    }

    .dark .subtitle {
      color: #aaa;
    }

    /* CARDS */
    .cards {
      max-width: 1000px;
      margin: auto;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 22px;
    }

    .card {
      padding: 30px 22px;
      border-radius: 20px;
      background: white;
      box-shadow: 0 10px 35px rgba(0,0,0,0.08);
      transition: 0.3s;
    }

    .dark .card {
      background: #181818;
      color: white;
      border: 1px solid #292929;
    }

    .card:hover {
      transform: translateY(-7px);
    }

    .icon {
      font-size: 42px;
      margin-bottom: 12px;
    }

    .card h3 {
      font-size: 22px;
      margin-bottom: 10px;
    }

    .card p {
      color: #777;
    }

    .dark .card p {
      color: #aaa;
    }

    /* ABOUT */
    .about {
      max-width: 800px;
      margin: auto;
      font-size: 19px;
    }

    /* CONTACT */
    .contact-box {
      max-width: 600px;
      margin: auto;
      padding: 35px 20px;
      border-radius: 25px;
      background: #171717;
      border: 1px solid #292929;
    }

    .phone {
      font-size: 25px;
      font-weight: bold;
      margin: 20px 0;
      direction: ltr;
    }

    /* FOOTER */
    footer {
      background: #050505;
      text-align: center;
      padding: 35px 20px;
      color: #888;
    }

    footer strong {
      color: white;
    }

    @media (max-width: 600px) {
      .logo {
        font-size: 48px;
      }

      .title {
        font-size: 30px;
      }

      section {
        padding: 60px 15px;
      }

      .hero-text {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <!-- HERO -->
  <header id="home">
    <div>

      <div class="logo">
        Tamraoui-<span class="tm">TM</span>
      </div>

      <div class="tagline">
        الموقع الرسمي
      </div>

      <p class="hero-text">
        مرحباً بكم في Tamraoui-TM.
        مساحة خاصة بالم
