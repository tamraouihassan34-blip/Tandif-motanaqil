<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عقاري | بيع وشراء وكراء العقارات في المغرب</title>

<meta name="description" content="عقاري - منصة مغربية لبيع وشراء وكراء العقارات. شقق، منازل، فيلات، أراضي ومحلات تجارية.">

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

html{
  scroll-behavior:smooth;
}

body{
  font-family:Arial,Tahoma,sans-serif;
  background:#f5f7fb;
  color:#172033;
  line-height:1.7;
}

button,input,select,textarea{
  font-family:inherit;
}

header{
  background:#071a35;
  color:#fff;
  padding:16px 5%;
  box-shadow:0 4px 20px #0003;
  position:sticky;
  top:0;
  z-index:1000;
}

.nav{
  max-width:1200px;
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:20px;
}

.logo{
  font-size:28px;
  font-weight:bold;
  color:#f5c451;
  white-space:nowrap;
}

nav{
  display:flex;
  gap:18px;
}

nav a{
  color:#fff;
  text-decoration:none;
  font-weight:bold;
  transition:.2s;
}

nav a:hover{
  color:#f5c451;
}

.hero{
  background:
    linear-gradient(135deg,#071a35e8,#17638de8),
    url("https://images.unsplash.com/photo-1564013799919-ab600027ffc6?auto=format&fit=crop&w=1600&q=80")
    center/cover;
  color:#fff;
  text-align:center;
  padding:75px 5% 65px;
}

.hero h1{
  font-size:42px;
  margin-bottom:12px;
}

.hero p{
  font-size:19px;
  margin-bottom:25px;
}

.add-btn{
  display:inline-block;
  background:#16a34a;
  color:#fff;
  text-decoration:none;
  padding:14px 25px;
  border-radius:12px;
  font-weight:bold;
  margin-bottom:30px;
  border:0;
  cursor:pointer;
  transition:.2s;
}

.add-btn:hover{
  transform:translateY(-2px);
  background:#12863d;
}

.search{
  max-width:1100px;
  margin:auto;
  background:#fff;
  padding:18px;
  border-radius:18px;
  display:grid;
  grid-template-columns:1.4fr 1fr 1fr 1fr .7fr;
  gap:10px;
  box-shadow:0 12px 35px #0004;
}

input,select,textarea{
  width:100%;
  padding:13px;
  border:1px solid #d9dee8;
  border-radius:10px;
  font-size:15px;
  outline:none;
  background:#fff;
  color:#172033;
}

input:focus,
select:focus,
textarea:focus{
  border-color:#17638d;
  box-shadow:0 0 0 3px #17638d18;
}

.search button{
  background:#f5c451;
  color:#071a35;
  border:0;
  border-radius:10px;
  font-weight:bold;
  cursor:pointer;
  font-size:16px;
}

.container{
  max-width:1200px;
  margin:auto;
  padding:55px 5%;
}

.title{
  text-align:center;
  margin-bottom:30px;
}

.title h2{
  font-size:30px;
  margin-bottom:5px;
}

.title p{
  color:#667085;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px;
  margin-bottom:45px;
}

.stat{
  background:#fff;
  border-radius:16px;
  padding:22px;
  text-align:center;
  box-shadow:0 7px 25px #0001;
}

.stat strong{
  display:block;
  font-size:30px;
  color:#123e67;
}

.stat span{
  color:#667085;
}

.cards{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:22px;
}

.card{
  background:#fff;
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 7px 25px #0001;
  transition:.3s;
  position:relative;
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 12px 30px #0002;
}

.card img{
  width:100%;
  height:220px;
  object-fit:cover;
  display:block;
}

.card-body{
  padding:18px;
}

.badge{
  display:inline-block;
  background:#f5c451;
  color:#071a35;
  padding:5px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.badge.green{
  background:#dcfce7;
  color:#166534;
}
